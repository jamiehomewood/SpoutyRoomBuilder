<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tour</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #fx { cursor: pointer; }
  #gl { pointer-events: none; }
  body.look #bg, body.look #fx, body.look #gl { display: none; }
  #msg { position: absolute; left: 12px; bottom: 10px; font: 16px system-ui, sans-serif; color: #888; pointer-events: none; }
  #help { position: absolute; bottom: 10px; right: 12px; color: #9aa3ad; font-size: 12px; background: rgba(21, 23, 26, .75); padding: 4px 8px; border-radius: 6px; display: none; }
  body.look #help { display: block; }
</style>
</head>
<body>
<!-- Tour player: a Tour Builder tour (Room Builder library rooms joined up by markers).
     tour.html?tour=<id>             the 360 output: the equirect fills the window (Spouty / ICE web layer, use a 2:1 layer)
     tour.html?tour=<id>&look=1      drag-to-look viewer, for checking a tour on a laptop (Room Builder only)
     &room=<room id>  start in that room      &sound=0  no sounds
     Served by Room Builder (/builder/tour.html) for previews, and by the scene server (/rbtour.html) in the room, where
     the tablet (control.html) gets the room's markers, questions and a tap-the-picture view through remote.js.
     Room PC keys: 1-9 answer, Enter = continue/close, Esc = close, Backspace = back, type a code then Enter. -->
<canvas id="bg"></canvas><canvas id="gl"></canvas><canvas id="fx"></canvas>
<div id="msg"></div>
<div id="help">Drag to look round · click markers · wheel to zoom</div>
<script>
  // three.js for the 3D objects: Room Builder serves it at /vendor, the scene server at /rb-static/vendor
  (function () {
    const b = location.pathname.startsWith('/builder/') ? '/' : '/rb-static/';
    const s = document.createElement('script'); s.type = 'importmap';
    s.textContent = JSON.stringify({ imports: { three: b + 'vendor/three/build/three.module.js', 'three/addons/': b + 'vendor/three/jsm/' } });
    document.currentScript.after(s);
  })();
</script>
<script>
(async function () {
  const Q = new URLSearchParams(location.search);
  const TOUR_ID = (Q.get('tour') || '').replace(/[^\w\-]/g, '');
  const RB = location.pathname.startsWith('/builder/');          // Room Builder's server; otherwise the scene server
  const LOOK = Q.get('look') === '1' && RB;
  const SOUND = Q.get('sound') !== '0';
  const $ = (id) => document.getElementById(id);
  const msg = (t) => { $('msg').textContent = t || ''; };
  const now = () => performance.now();
  const imgUrl = (r) => (RB ? '/library/' : '/rb/') + r.lib + '/view_' + (r.view || 'centre') + '.jpg';
  const BASE = RB ? '/' : '/rb-static/';                          // where catalogue/ and vendor/ are on this server

  let T;
  try {
    const res = await fetch((RB ? '/api/tours/' : '/api/rbtour/') + TOUR_ID, { cache: 'no-store' });
    T = await res.json();
    if (!res.ok || T.error) throw new Error(T.error || res.status);
  } catch (e) { msg('Could not load the tour "' + TOUR_ID + '": ' + e.message); return; }
  T.rooms = T.rooms || []; T.items = T.items || [];
  document.title = T.name || 'Tour';
  if (!T.rooms.length) { msg('This tour has no rooms yet'); return; }

  const roomById = (id) => T.rooms.find((r) => r.id === id);
  const itemName = (id) => (T.items.find((i) => i.id === id) || {}).name || 'an item';
  const markerById = (id) => { for (const r of T.rooms) for (const m of r.markers || []) if (m.id === id) return m; return null; };
  const LETTERS = 'ABCDEFGHI';
  // catalogue entries (model.json) for the items that have a 3D model
  const MODELS = {};
  await Promise.all([...new Set(T.items.map((i) => i.model).filter(Boolean))].map(async (id) => {
    try { MODELS[id] = await (await fetch(BASE + 'catalogue/models/' + encodeURIComponent(id) + '/model.json', { cache: 'no-store' })).json(); } catch (e) {}
  }));
  const itemOf = (id) => T.items.find((i) => i.id === id);
  const modelOf = (id) => { const it = itemOf(id); return it && it.model && MODELS[it.model] ? it.model : null; };
  const thumbOf = (id) => { const mid = modelOf(id), m = mid && MODELS[mid]; return m && m.thumb ? `${BASE}catalogue/models/${encodeURIComponent(mid)}/${m.thumb}` : ''; };
  const has3d = (m) => m.type === 'item' && m.show3d !== false && !!modelOf(m.item);
  const pagesOf = (id) => { const it = itemOf(id) || {}; return (it.pages || []).filter((x) => String(x).trim()); };
  const WALLS = { front: 0, right: 90, back: 180, left: -90 };
  const wallOf = (yaw) => { const w = Math.round(yaw / 90) * 90; return w === -180 ? 180 : w; };   // cards sit in the middle of a wall
  const wrap180 = (a) => ((a + 540) % 360) - 180;
  const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

  // ------------------------------------------------------------------ state
  const loadedAt = now();
  let S;
  function fresh() {
    S = { room: null, history: [], items: new Set(), found: new Set(), taken: new Set(), unlocked: new Set(), answers: {},
          visited: new Set(), introSeen: new Set(), score: { asked: 0, right: 0 }, card: null, toast: null, titleUntil: 0, typed: '',
          sel: null, insp: null, inspN: 0, rot: { rx: 0, ry: 0, zoom: 1 }, page: 0, usedFirst: new Set() };
  }
  fresh();
  const visible = (m) => (!m.hidden || S.found.has(m.id)) && !S.taken.has(m.id);
  const locked = (m) => m.type === 'go' && (((m.requires || []).some((i) => !S.items.has(i))) || (m.code && !S.unlocked.has(m.id)));

  // ------------------------------------------------------------------ canvases (everything is drawn in 0.1 degree units: 3600 x 1800)
  const bg = $('bg'), fx = $('fx'), bgc = bg.getContext('2d'), c = fx.getContext('2d');
  let W = 0, H = 0, bgDirty = true, bright = 0, curImg = null;
  function size() {
    if (LOOK) { W = 4096; H = 2048; }
    else { const dpr = Math.min(devicePixelRatio || 1, 2); W = Math.min(8192, Math.round(innerWidth * dpr)); H = Math.round(innerHeight * dpr); }
    if (bg.width !== W || bg.height !== H) { bg.width = fx.width = W; bg.height = fx.height = H; }
    bgDirty = true;
  }
  addEventListener('resize', size); size();

  // live 3D objects (items with a model): drawn into the 360 picture on their own canvas, between the render and the markers
  const gl = $('gl'); let t3 = null;
  try {
    const mod = await import(BASE + 'builder/tour3d.js');
    t3 = mod.createTour3D({ canvas: gl, base: BASE, onLoad: () => changed() });
    t3.setSize(W, H); addEventListener('resize', () => t3.setSize(W, H));
  } catch (e) { console.error('3D objects are off:', e); }
  const eyeOf = (r) => (r && r.dims && +r.dims.eye) || 1.12;
  function wallDist(r, yaw) {
    const d = (r && r.dims) || {}, hw = (d.w || 6.4) / 2, hd = (d.d || 5.71) / 2, a = yaw * Math.PI / 180;
    const sx = Math.abs(Math.sin(a)), cy = Math.abs(Math.cos(a));
    return Math.min(sx > 1e-6 ? hw / sx : 1e9, cy > 1e-6 ? hd / cy : 1e9);
  }
  const baseH = (r, m) => m.h != null && m.h !== '' ? +m.h : eyeOf(r) + (+m.dist || 1.5) * Math.tan(m.pitch * Math.PI / 180);
  function sync3d() {
    if (!t3) return;
    const r = roomById(S.room);
    t3.sync(r ? (r.markers || []).filter((m) => has3d(m) && !S.taken.has(m.id) && m.id !== S.holding).map((m) => ({ key: m.id, model: modelOf(m.item), yaw: m.yaw,
      dist: +m.dist || 1.5, h: baseH(r, m), eye: eyeOf(r), turn: +m.turn || 0, size: +m.size || 1 })) : []);
    const mid = S.insp && modelOf(S.insp);
    if (r && mid) {
      const yaw = S.inspYaw ?? (WALLS[r.cardWall] ?? 0);                // held up on the wall its marker is on, under the card
      t3.setInspect({ model: mid, yaw, dist: wallDist(r, yaw) - 0.35, y: -0.3, fit: 0.7, rx: S.rot.rx, ry: S.rot.ry, zoom: S.rot.zoom });
    } else t3.setInspect(null);
    // what you carry: a strip lying on the floor, parallel to the card wall, 60 cm in from it
    if (r && S.items.size && t3.setFloorText) {
      const home = WALLS[r.cardWall] ?? 0, half = wallDist(r, home);
      const along = home % 180 === 0 ? (+(r.dims && r.dims.w) || 6.4) : (+(r.dims && r.dims.d) || 5.71);   // that wall's length
      t3.setFloorText({ text: 'Carrying: ' + [...S.items].map(itemName).join(' · '), yaw: home, dist: half - 0.6, eye: eyeOf(r), maxW: along * 0.7 });
    } else if (t3 && t3.setFloorText) t3.setFloorText(null);
  }

  const cache = {};
  function loadImg(r) {
    const u = imgUrl(r);
    if (!cache[u]) cache[u] = new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Could not load ' + u)); i.src = u; });
    return cache[u];
  }

  // ------------------------------------------------------------------ sounds (made on the fly, no files)
  let actx = null;
  function sound(kind) {
    if (!SOUND) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
      const notes = { yes: [[660, 0], [880, .12]], no: [[220, 0], [180, .16]], tick: [[740, 0]], door: [[180, 0], [140, .1]] }[kind] || [];
      for (const [f, t0] of notes) {
        const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + t0;
        o.type = kind === 'door' ? 'triangle' : 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(kind === 'door' ? 0.12 : 0.18, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + (kind === 'door' ? 0.5 : 0.3));
        o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.6);
      }
    } catch (e) {}
  }
  addEventListener('pointerdown', () => { if (actx && actx.state === 'suspended') actx.resume(); });

  // ------------------------------------------------------------------ moving between rooms (dip to black)
  let busy = false;
  function fadeTo(target, ms) {
    return new Promise((res) => {
      const from = bright, t0 = now();
      (function step() {
        const k = Math.min(1, (now() - t0) / ms);
        bright = from + (target - from) * k; bgDirty = true;
        if (k < 1) setTimeout(step, 16); else res();         // a timer, not animation frames: a hidden page must not get stuck mid-fade
      })();
    });
  }
  async function goTo(id, opt = {}) {
    const r = roomById(id);
    if (!r) { toast('That room is missing from the tour'); return; }
    if (busy) return;
    busy = true; S.card = null; S.typed = ''; S.toast = null;
    const p = loadImg(r).catch((e) => { msg(e.message); return null; });
    if (curImg) { sound('door'); await fadeTo(0, 450); }
    const im = await p;
    if (!opt.back && !opt.fresh && S.room && S.room !== id) S.history.push(S.room);
    S.room = id; curImg = im; S.visited.add(id); S.titleUntil = now() + 4500; bgDirty = true;
    S.insp = null; S.holding = null; if (t3) { t3.setRoom(imgUrl(r)); } sync3d();
    if (im) msg('');
    await fadeTo(1, 550);
    busy = false;
    if (r.end) S.card = { kind: 'end', yaw: WALLS[r.cardWall] ?? 0, title: r.name || 'The end', text: endText(r) };
    else if (r.intro && !S.introSeen.has(id)) { S.introSeen.add(id); S.card = { kind: 'intro', yaw: WALLS[r.cardWall] ?? 0, title: r.name || '', text: r.intro }; }
    changed();
    for (const m of r.markers || []) if (m.type === 'go' && roomById(m.target)) loadImg(roomById(m.target)).catch(() => {});   // next rooms ready
  }
  function endText(r) {
    const bits = [r.endText || 'You have reached the end of the tour.', ''];
    bits.push(`Rooms visited: ${S.visited.size} of ${T.rooms.length}`);
    if (S.score.asked) bits.push(`Right first time (questions and tasks): ${S.score.right} of ${S.score.asked}`);
    if (S.items.size) bits.push('Found: ' + [...S.items].map(itemName).join(', '));
    return bits.join('\n');
  }
  function back() { if (S.history.length && !busy) goTo(S.history.pop(), { back: true }); }
  function restart() { fresh(); curImg = null; bright = 0; bgDirty = true; goTo(startId, { fresh: true }); }

  // ------------------------------------------------------------------ what markers do
  let toastT = 0;
  function toast(text, yaw) {
    const r = roomById(S.room) || {};
    S.toast = { text, yaw: yaw == null ? (WALLS[r.cardWall] ?? 0) : wallOf(yaw), until: now() + 3500 };
    clearTimeout(toastT); toastT = setTimeout(() => { S.toast = null; changed(); }, 3600);
    changed();
  }
  function activate(m) {
    if (!m || busy) return;
    const r = roomById(S.room);
    if (!r || !(r.markers || []).includes(m)) return;                    // only markers in the room we're in
    const wasHidden = m.hidden && !S.found.has(m.id);
    if (m.hidden) S.found.add(m.id);
    if (S.taken.has(m.id)) return;
    const yaw = wallOf(m.yaw);
    S.typed = '';
    if (m.type === 'go') {
      const missing = (m.requires || []).filter((i) => !S.items.has(i));
      if (missing.length) { sound('no'); toast(m.lockedText || 'Locked. You need: ' + missing.map(itemName).join(', '), m.yaw); return; }
      if (m.code && !S.unlocked.has(m.id)) {
        sound('tick'); S.card = { kind: 'code', mid: m.id, yaw, title: m.label || 'Locked', text: m.codePrompt || (RB ? 'Type the code.' : 'Enter the code on the tablet.') };
      } else if (!roomById(m.target)) { toast('This doesn\'t lead anywhere yet', m.yaw); return; }
      else { goTo(m.target); return; }
    } else if (m.type === 'info') {
      sound(wasHidden ? 'yes' : 'tick'); S.card = { kind: 'info', mid: m.id, yaw, title: m.title || m.label || 'Information', text: m.text || '' };
    } else if (m.type === 'question') {
      sound(wasHidden ? 'yes' : 'tick');
      const done = has(S.answers, m.id) && !m.retry;
      S.card = { kind: 'question', mid: m.id, yaw, title: m.label || 'Question', text: m.text || '', options: (m.options || []).map((o) => o.text || ''),
                 choice: done ? S.answers[m.id] : null, feedback: done ? feedbackFor(m, S.answers[m.id]) : '' };
    } else if (m.type === 'item' && m.take === 'choose') {               // students choose: hold it up, then "Take it" or "Put it back"
      sound(wasHidden ? 'yes' : 'tick'); inspect(m.item, m.text || '', m.id, true, m.yaw); return;
    } else if (m.type === 'item' && m.take === false) {                  // look only: hold it up, then put it back where it was
      sound(wasHidden ? 'yes' : 'tick');
      const it = itemOf(m.item) || {};
      if (m.item && (modelOf(m.item) || pagesOf(m.item).length || it.description || m.text)) { inspect(m.item, m.text || '', m.id, false, m.yaw); return; }
      toast(itemName(m.item), m.yaw); return;
    } else if (m.type === 'item') {
      S.taken.add(m.id); sound('yes');
      if (m.item) { S.items.add(m.item); S.sel = m.item; }
      const it = itemOf(m.item) || {};
      if (m.item && (modelOf(m.item) || pagesOf(m.item).length || it.description)) { inspect(m.item, m.text || '', null, false, m.yaw); return; }
      if (m.text) S.card = { kind: 'found', mid: m.id, yaw, title: 'Found: ' + itemName(m.item), text: m.text };
      else toast('Found: ' + itemName(m.item), m.yaw);
    } else if (m.type === 'use') {                                     // a person or place that takes items (give the notes to the doctor)
      sound('tick'); useCard(m);
    }
    changed();
  }

  // ------------------------------------------------------------------ the bag: look at, read and give items
  // lookAt = the marker id when it is only being looked at (not taken): its model leaves the room while it's held, then goes back
  // at = the marker's yaw: the object pops up on that wall (near where it was, kept on the wall); from the bag: the card wall
  function inspect(itemId, foundText, lookAt, choose, at) {
    const r = roomById(S.room) || {}, home = WALLS[r.cardWall] ?? 0;
    const wall = at == null ? home : wallOf(at);
    S.inspYaw = at == null ? wall : wall + Math.max(-25, Math.min(25, wrap180(at - wall)));
    S.insp = itemId; if (!lookAt) S.sel = itemId; S.holding = lookAt || null; S.inspN++; S.rot = { rx: 0, ry: 0, zoom: 1 }; S.page = 0;
    // with a model the card goes high and wide across the top of the same wall, out of the way of the object below it
    S.card = { kind: 'inspect', item: itemId, look: !!lookAt, choose: !!(lookAt && choose), yaw: wall, w: modelOf(itemId) ? 700 : 580, high: !!modelOf(itemId),
               title: (foundText != null && !lookAt ? 'Found: ' : '') + itemName(itemId), found: foundText || '' };
    S.card.text = inspectText(S.card);
    changed();
  }
  function inspectText(cd) {
    const it = itemOf(cd.item) || {}, pages = pagesOf(cd.item);
    const body = pages.length ? pages[Math.min(S.page, pages.length - 1)] : (it.description || '');
    return [cd.found, body].filter(Boolean).join('\n\n');
  }
  function turnPage(d) {
    const cd = S.card, n = cd && cd.kind === 'inspect' ? pagesOf(cd.item).length : 0; if (n < 2) return;
    S.page = Math.max(0, Math.min(n - 1, S.page + d)); cd.found = ''; cd.text = inspectText(cd); sound('tick'); changed();
  }
  function useCard(m) {
    const r = roomById(S.room) || {}, carried = [...S.items];
    S.card = { kind: 'use', mid: m.id, yaw: wallOf(m.yaw), title: m.label || 'Give or use', text: (m.text || '') + (carried.length ? '' : (m.text ? '\n\n' : '') + 'You have nothing to give yet.'),
               options: carried.map((i) => 'Give: ' + itemName(i)), optItems: carried, choice: null };
    changed();
  }
  function give(mid, itemId) {
    const m = markerById(mid), r = roomById(S.room);
    if (!m || !r || !(r.markers || []).includes(m) || !S.items.has(itemId) || busy) return;
    const acc = (m.accepts || []).find((a) => a.item === itemId), scoredUse = (m.accepts || []).some((a) => a.correct);
    if (scoredUse && !S.usedFirst.has(mid)) { S.usedFirst.add(mid); S.score.asked++; if (acc && acc.correct) S.score.right++; }
    const good = acc ? (!!acc.correct || !scoredUse) : false;
    if (acc && acc.consume) { S.items.delete(itemId); if (S.sel === itemId) S.sel = null; }
    if (acc && acc.give) { S.items.add(acc.give); S.sel = acc.give; }
    if (S.insp === itemId || (acc && acc.consume)) S.insp = null;
    S.card = { kind: 'useResult', mid, yaw: wallOf(m.yaw), title: `${m.label || 'Give or use'}: ${itemName(itemId)}`, good,
               text: acc ? (acc.feedback || (good ? 'That\'s right.' : 'Not quite.')) : (m.wrongText || 'That isn\'t what\'s needed here.'),
               go: acc && acc.go && roomById(acc.go) ? acc.go : null };
    sound(good ? 'yes' : 'no');
    changed();
  }
  const scored = (m) => (m.options || []).some((o) => o.correct);
  function feedbackFor(m, i) {
    const o = (m.options || [])[i] || {};
    return o.feedback || (scored(m) ? (o.correct ? 'Correct.' : 'Not quite.') : '');
  }
  function answer(i) {
    const cd = S.card; if (!cd || cd.kind !== 'question' || cd.choice != null) return;
    const m = markerById(cd.mid), o = m && (m.options || [])[i]; if (!o) return;
    if (!has(S.answers, m.id) && scored(m)) { S.score.asked++; if (o.correct) S.score.right++; }
    S.answers[m.id] = i; cd.choice = i; cd.feedback = feedbackFor(m, i);
    if (o.give) S.items.add(o.give);
    sound(scored(m) ? (o.correct ? 'yes' : 'no') : 'tick');
    changed();
  }
  function cardButton() {                         // Continue / Close
    const cd = S.card; if (!cd) return;
    if (cd.kind === 'end') return;
    if (cd.kind === 'useResult') { S.card = null; changed(); if (cd.go) goTo(cd.go); return; }
    if (cd.kind === 'inspect') { closeCard(); return; }
    if (cd.kind === 'question') {
      if (cd.choice == null) return;
      const m = markerById(cd.mid), o = (m.options || [])[cd.choice] || {};
      if (scored(m) && !o.correct && m.retry) { cd.choice = null; cd.feedback = ''; changed(); return; }
      S.card = null; changed();
      if (o.go && roomById(o.go)) goTo(o.go);
      return;
    }
    S.card = null; S.typed = ''; changed();
  }
  // "Let students choose": they take what they're holding instead of putting it back
  function takeHeld() {
    const cd = S.card, m = S.holding && markerById(S.holding);
    if (!cd || cd.kind !== 'inspect' || !cd.choose || !m) return;
    S.taken.add(m.id); if (m.item) { S.items.add(m.item); S.sel = m.item; }
    S.insp = null; S.holding = null; S.card = null; sound('yes');
    toast('In your bag: ' + itemName(m.item), m.yaw);
  }
  function closeCard() { if (S.card && S.card.kind !== 'end') { if (S.card.kind === 'inspect') { S.insp = null; S.holding = null; } S.card = null; S.typed = ''; changed(); } }
  const chooseOption = (i) => { const cd = S.card; if (!cd) return; if (cd.kind === 'use') { if (cd.optItems[i]) give(cd.mid, cd.optItems[i]); } else answer(i); };
  const normCode = (s) => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
  function tryCode(v) {
    const cd = S.card; if (!cd || cd.kind !== 'code') return;
    const m = markerById(cd.mid); if (!m) return;
    if (normCode(v) && normCode(v) === normCode(m.code)) {
      S.unlocked.add(m.id); S.card = null; S.typed = ''; sound('yes'); toast('Unlocked', m.yaw);
      setTimeout(() => goTo(m.target), 900);
    } else { sound('no'); cd.error = 'That code doesn\'t work. Try again.'; S.typed = ''; changed(); }
  }

  // ------------------------------------------------------------------ hit testing (angles)
  function markerAt(yaw, pitch) {
    const r = roomById(S.room); if (!r) return null;
    let best = null, bd = 1e9;
    for (const m of r.markers || []) {
      if (S.taken.has(m.id)) continue;
      const hiddenNow = m.hidden && !S.found.has(m.id);
      const at = spot(m);
      const rad = at.rad || (hiddenNow ? (m.radius || 6) : Math.max(4.5, m.radius || 0));

        list.push({ id: 'cont', type: 'button', group: G, label: 'Continue', action: 'OK' });
      } else if (cd.kind === 'question') {
        if (cd.choice == null) {
          list.push({ id: 'card', type: 'text', group: G, label: cd.title, hint: cd.text });
          cd.options.forEach((o, i) => list.push({ id: `a_${cd.mid}_${i}`, type: 'button', group: G, label: `${LETTERS[i]}. ${o}`, action: 'Choose' }));
        } else {
          list.push({ id: 'card', type: 'text', group: G, label: `${cd.title}: ${LETTERS[cd.choice]}. ${cd.options[cd.choice] || ''}`, hint: cd.feedback });
          list.push({ id: 'cont', type: 'button', group: G, label: 'Continue', action: 'OK' });
        }
      } else {
        list.push({ id: 'card', type: 'text', group: G, label: cd.title, hint: cd.text + (cd.error ? '\n' + cd.error : '') });
        if (cd.kind === 'code') list.push({ id: 'code', type: 'code', group: G, label: 'Code' });
        if (cd.kind === 'end') list.push({ id: 'restart', type: 'button', group: G, label: 'Start the tour again', action: 'Restart' });
        else list.push({ id: 'close', type: 'button', group: G, label: 'Take the card off the wall', action: 'Close' });
      }
    }
    if (S.items.size) {                                             // the bag: pick an item, then look at it or give it to someone here
      list.push({ id: 'bag', type: 'inventory', group: 'Your bag', label: 'Your bag', selected: S.sel,
                  items: [...S.items].map((id) => ({ id, name: itemName(id), thumb: thumbOf(id) })) });
      if (S.sel && S.items.has(S.sel)) {
        if (S.insp !== S.sel && (modelOf(S.sel) || pagesOf(S.sel).length || (itemOf(S.sel) || {}).description))
          list.push({ id: 'look', type: 'button', group: 'Your bag', label: 'Look at the ' + itemName(S.sel), action: modelOf(S.sel) ? 'Look' : 'Read' });
        for (const m of (r ? r.markers || [] : []).filter((x) => x.type === 'use' && visible(x)))
          list.push({ id: `giveto:${m.id}`, type: 'button', group: 'Your bag', label: `Give the ${itemName(S.sel)} to ${m.label || 'them'}`, action: 'Give' });
      }
    }
    if (r) {
      const vis = (r.markers || []).filter(visible);
      list.push({ id: 'pano', type: 'pano', group: 'In this room', label: 'Tap the picture to look closer or go somewhere', src: imgUrl(r),
                  markers: vis.map((m) => { const a = spot(m); return { yaw: a.yaw, pitch: a.pitch, label: m.label || '', kind: locked(m) ? 'lock' : m.type }; }) });
      for (const m of vis) list.push({ id: 'm_' + m.id, type: 'button', group: 'In this room', label: m.label || verb(m), action: verb(m) });
    }
    if (S.history.length) list.push({ id: 'back', type: 'button', group: 'Facilitator', staff: true, label: 'Back to ' + ((roomById(S.history[S.history.length - 1]) || {}).name || 'the last room'), action: 'Back' });
    list.push({ id: 'restart', type: 'button', group: 'Facilitator', staff: true, label: 'Restart the tour', hint: 'Clears found items and answers', action: 'Restart' });
    for (const x of T.rooms) if (x.id !== S.room) list.push({ id: 'j_' + x.id, type: 'button', group: 'Jump to a room', staff: true, label: x.name || 'Room', action: 'Go' });
    const seen = new Set(); ctrls.length = 0;
    for (const x of list) if (!seen.has(x.id)) { seen.add(x.id); ctrls.push(x); }   // ids must be unique (restart can appear twice)
  }
  function changed() { sync3d(); if (window.Remote) { buildControls(); if (Remote.report) Remote.report(); } }
  function remoteSet(id, v) {
    if (id === 'turn') {                                                // absolute turn from the student tablet, for this look only
      if (v && typeof v === 'object' && v.s === S.inspN && S.insp) {
        S.rot.rx = Math.max(-85, Math.min(85, +v.rx || 0)); S.rot.ry = +v.ry || 0; S.rot.zoom = Math.max(0.4, Math.min(2.5, +v.zoom || 1)); sync3d();
      }
      return;
    }
    if (id === 'bag') { if (v && typeof v === 'object' && v.n !== lastN.bag) { lastN.bag = v.n; if (S.items.has(v.v)) { S.sel = v.v; changed(); } } return; }
    if (id.startsWith('give:')) { const [, mid, it] = id.split(':'); return give(mid, it); }
    if (id.startsWith('giveto:')) return S.sel ? give(id.slice(7), S.sel) : undefined;
    if (id === 'look') return S.sel ? inspect(S.sel) : undefined;
    if (id === 'putaway') return closeCard();
    if (id === 'takeit') return takeHeld();
    if (id === 'pg_prev') return turnPage(-1);
    if (id === 'pg_next') return turnPage(1);
    if (id === 'pano' || id === 'code') {                               // {..., n}: n makes every tap/try a new one
      if (!v || typeof v !== 'object' || v.n === lastN[id]) return;
      lastN[id] = v.n;
      if (now() - loadedAt < 1500) return;                               // left over from before this page loaded
      if (id === 'pano') tapAngles(+v.yaw || 0, +v.pitch || 0); else tryCode(String(v.v || ''));
      return;
    }
    if (id.startsWith('m_')) return activate(markerById(id.slice(2)));
    if (id.startsWith('a_')) return answer(+id.slice(id.lastIndexOf('_') + 1));
    if (id.startsWith('j_')) return goTo(id.slice(2));
    if (id === 'cont') return cardButton();
    if (id === 'close') return closeCard();
    if (id === 'back') return back();
    if (id === 'restart') return restart();
  }
  if (!RB) {
    await new Promise((res) => { const s = document.createElement('script'); s.src = '/remote.js'; s.onload = res; s.onerror = res; document.head.append(s); });
    if (window.Remote) { buildControls(); Remote.init({ title: T.name || 'Tour', controls: ctrls, get: () => undefined, set: remoteSet }); }
  }

  const startId = roomById(Q.get('room')) ? Q.get('room') : (roomById(T.start) ? T.start : T.rooms[0].id);
  requestAnimationFrame(frame);
  goTo(startId, { fresh: true });
})();
</script>
