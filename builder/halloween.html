<body>
<canvas id="c"></canvas>
<div id="start">Click to start the Halloween room<small>sound needs a click · keys 1–9, 0, F, J, C, R trigger scares · A auto · M mute · H hide this</small></div>
<div id="hud" hidden></div>
<script type="module">
// Halloween scare layer for a Room Builder render, shown as one equirectangular 360 image (give it to Spouty at
// 4096 x 2048, or an Igloo web layer set to 360 / equirectangular).
//   ?lit=<library id of the lights-on render>&dark=<library id of the lights-off render>&view=centre
//   &auto=1 (default) runs the 8-minute cycle, &cycle=<seconds>, &hud=0 hides the status box, &autostart=0 shows a click-to-start screen (it starts by itself otherwise), &demo=1 plays every scare in under 2 minutes, &look=1 shows a flat camera view that turns to each scare
// Lights flicker and black out by cross-fading the two renders; lightning, the pumpkin flare and room shake are applied on
// top; doors, spiders, the pumpkin face, the ghost, bats and the figure outside are 3D objects rendered from the eye point,
// hidden behind an invisible copy of the room's walls so they only show where they should (e.g. the figure through the window).
// Photosensitivity: no more than two flashes in any second, flicker steps at least 0.35 s apart.
import * as THREE from 'three';
import { buildRoom, roomFrame, b2t, span, applyItem } from './scene.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const P = new URLSearchParams(location.search);
const EMB = window.__HW_DATA || null;                      // the stand-alone copy carries its room and renders inside the file
const LIT = EMB ? EMB.litName : P.get('lit'), DARK = EMB ? EMB.darkName : P.get('dark'), VIEW = P.get('view') || 'centre';
const LOOK = P.get('look') === '1';                       // &look=1: a flat camera view that turns to each scare (for screen recording)
const DEMO = P.get('demo') === '1';                       // &demo=1: every scare in about 90 s (for showing people / recording)
const CYCLE = +(P.get('cycle') || (DEMO ? 106 : 480));
let auto = P.get('auto') !== '0';
const hud = document.getElementById('hud'); let hudOn = P.get('hud') !== '0';

// ------------------------------------------------------------------ renderer and compositor
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, preserveDrawingBuffer: false });
renderer.outputColorSpace = THREE.SRGBColorSpace;
function resize() { renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight, false); }
addEventListener('resize', resize); resize();

// problems are shown on screen in big text: in the room there is no console to look at
const problem = msg => { const d = document.createElement('div'); d.textContent = msg;
  d.style.cssText = 'position:fixed;left:0;right:0;top:40%;text-align:center;font:bold 42px sans-serif;color:#ff5040;z-index:9;padding:20px';
  document.body.appendChild(d); console.error(msg); };

addEventListener('unhandledrejection', e => problem('Error: ' + (e.reason?.message || e.reason)));
if (!LIT) problem('No lit= render named in the address');
let spec;
if (EMB) spec = EMB.spec;
else {
  const specRes = await fetch(`/library/${encodeURIComponent(LIT)}/spec.json`).catch(() => null);
  if (!specRes || !specRes.ok) problem(`Can't find library/${LIT}/spec.json on this PC (is that render folder copied, and the server running?)`);
  spec = await specRes.json();
}
const F = roomFrame(spec);
const view = (spec.views || []).find(v => v.name === VIEW) || spec.views?.[0] || { x: 0, y: 0, yaw: 0 };
const EYE = b2t(+view.x || 0, +view.y || 0, +(view.z ?? F.eye));

const loader = new THREE.TextureLoader();
const loadTex = url => new Promise(res => loader.load(url, t => { t.colorSpace = THREE.SRGBColorSpace; t.wrapS = THREE.RepeatWrapping; t.anisotropy = 4; res(t); }, undefined, () => res(null)));

const texDark = DARK ? (await loadTex(EMB ? EMB.dark : `/library/${encodeURIComponent(DARK)}/view_${VIEW}.jpg`)) : null;
if (!texLit) problem(`Can't load library/${LIT}/view_${VIEW}.jpg on this PC`);
if (DARK && !texDark) problem(`Can't load library/${DARK}/view_${VIEW}.jpg on this PC`);

const cubeRT = new THREE.WebGLCubeRenderTarget(1024, { generateMipmaps: false, type: THREE.HalfFloatType });
const cubeCam = new THREE.CubeCamera(0.02, 60, cubeRT); cubeCam.position.copy(EYE);
const U = {
  lit: { value: texLit }, dark: { value: texDark || texLit }, hasDark: { value: texDark ? 1 : 0 }, env: { value: cubeRT.texture },
  lightMix: { value: 1 }, bright: { value: 1 }, flash: { value: 0 }, flashDir: { value: new THREE.Vector3(1, 0, 0) },
  glow: { value: 0 }, glowDir: { value: new THREE.Vector3(0, 0, -1) }, shake: { value: new THREE.Vector2(0, 0) }, look: { value: LOOK ? 1 : 0 }, tint: { value: new THREE.Vector3(1, 1, 1) }, tintAmt: { value: 0 }, camYaw: { value: 0 }, camPitch: { value: 0 },
  tanH: { value: Math.tan(37 * Math.PI / 180) }, aspect: { value: 16 / 9 }, viewYaw: { value: (+view.yaw || 0) * Math.PI / 180 },
};
const comp = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  uniforms: U, depthTest: false, depthWrite: false,
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader: `
    uniform sampler2D lit, dark; uniform float hasDark; uniform samplerCube env;
    uniform float lightMix, bright, flash, glow, viewYaw, look, camYaw, camPitch, tanH, aspect; uniform vec3 flashDir, glowDir, tint; uniform float tintAmt; uniform vec2 shake;
    varying vec2 vUv;
    void main(){
      float lon = (vUv.x - 0.5) * 6.28318530718 + shake.x;
      float lat = clamp((vUv.y - 0.5) * 3.14159265359 + shake.y, -1.5707, 1.5707);
      if (look > 0.5) {                                     // camera mode: a normal flat view looking round the room
        vec3 r = normalize(vec3((vUv.x - 0.5) * 2.0 * tanH * aspect, (vUv.y - 0.5) * 2.0 * tanH, -1.0));
        r = vec3(r.x, r.y * cos(camPitch) - r.z * sin(camPitch), r.y * sin(camPitch) + r.z * cos(camPitch));
        r = vec3(r.x * cos(camYaw) - r.z * sin(camYaw), r.y, r.x * sin(camYaw) + r.z * cos(camYaw));
        lon = atan(r.x, -r.z) - viewYaw + shake.x * 2.0;
        lat = clamp(asin(r.y) + shake.y * 2.0, -1.5707, 1.5707);
      }
      vec2 puv = vec2(fract(lon / 6.28318530718 + 0.5), lat / 3.14159265359 + 0.5);
      vec3 L = texture2D(lit, puv).rgb;
      vec3 D = hasDark > 0.5 ? texture2D(dark, puv).rgb : L * 0.12;
      vec3 base = mix(D, L, lightMix) * bright;
      float wl = lon + viewYaw;
      vec3 d = vec3(sin(wl) * cos(lat), sin(lat), -cos(wl) * cos(lat));
      // lightning: the whole room lifts a little, the window side a lot (cool white)
      float fw = pow(max(dot(d, flashDir), 0.0), 3.0);
      base += flash * (base * 1.6 + vec3(0.06, 0.07, 0.09)) * (0.35 + 1.4 * fw);
      // a pumpkin flaring up: warm light round the pumpkin
      float g = pow(max(dot(d, glowDir), 0.0), 220.0);
      base += glow * (vec3(1.0, 0.42, 0.05) * g * 1.4 + base * vec3(0.5, 0.2, 0.02) * pow(max(dot(d, glowDir), 0.0), 6.0));
      // haunting: the room's light turns a spooky colour (changes are slow fades, never flicker)
      float lum = dot(base, vec3(0.299, 0.587, 0.114));
      base = mix(base, tint * lum * 1.7 + base * 0.08, tintAmt);
      vec4 o = textureCube(env, d);
      gl_FragColor = vec4(mix(base, o.rgb, o.a), 1.0);
      #include <colorspace_fragment>
    }`,
}));
const compScene = new THREE.Scene(); compScene.add(comp);
const compCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

// ------------------------------------------------------------------ the 3D overlay scene
const scene = new THREE.Scene();
// an invisible copy of the room: writes depth only, so effects behind walls are hidden; glass and nets let them through
const room = buildRoom(EMB ? { ...spec, items: [], decals: [] } : { ...spec, items: (spec.items || []).filter(i => !i.live) });   // stand-alone: walls only (no model files to load)
room.root.traverse(o => {
  if (!o.isMesh) return;
  const m = o.material, see = m && (m.transparent || m.opacity < 1);
  if (see || o.name === 'decals' || o.parent?.name === 'decals') { o.visible = false; return; }
  o.material = new THREE.MeshBasicMaterial({ colorWrite: false });
});
const decGroup = room.root.getObjectByName('decals'); if (decGroup) decGroup.visible = false;
scene.add(room.root);
const amb = new THREE.AmbientLight(0xffffff, 0.4); scene.add(amb);
const bulb = new THREE.PointLight(0xffd8a0, 3, 9, 1.4); bulb.position.copy(b2t(0, Math.min(0.9, F.D / 4), F.RH - 0.2)); scene.add(bulb);
const flashLight = new THREE.DirectionalLight(0xcfe0ff, 0); scene.add(flashLight); scene.add(flashLight.target);

const items = spec.items || [];
// ---- live items: models marked "live" are left out of the renders and drawn here so they can move (the rocking chair)
const live = [];
for (const it of items.filter(i => i.live)) {
  try {
    const meta = EMB ? EMB.models[it.model].meta : await (await fetch(`/catalogue/models/${encodeURIComponent(it.model)}/model.json`)).json();
    const url = EMB ? EMB.models[it.model].gltf : `/catalogue/models/${encodeURIComponent(it.model)}/${meta.file}`;
    const gl = await new GLTFLoader().loadAsync(url), m = gl.scene;
    m.updateMatrixWorld(true); const box = new THREE.Box3().setFromObject(m), c = box.getCenter(new THREE.Vector3());
    m.position.set(-c.x, -box.min.y, -c.z);
    const rocker = new THREE.Group(); rocker.add(m); const g = new THREE.Group(); g.add(rocker);
    applyItem(g, it, meta); scene.add(g);
    m.traverse(o => { if (o.isMesh && o.material) { o.material.envMapIntensity = 0; } });
    live.push({ it, g, rocker, len: box.getSize(new THREE.Vector3()).z });
  } catch (e) { console.warn('live item failed', it.model, e); }
}
const chair = live.find(l => /rock/i.test(l.it.model));
if (chair) {                                                 // the candles and pumpkin beside it light it, warm and low
  const warm = new THREE.PointLight(0xff9a40, 1.6, 3.5, 1.6); warm.position.copy(chair.g.position).add(new THREE.Vector3(0, 0.6, 0)).lerp(EYE.clone().setY(0.6), 0.15); scene.add(warm);
}
const PUMPKINS = items.filter(i => i.model === 'rb_jack_o_lantern').map(i => b2t(+i.x, +i.y, +(i.z || 0) + 0.15 * (+i.scale || 1)));
const CLOCK = items.find(i => /clock/.test(i.model));
const WINDOW = (spec.features || []).find(f => f.type === 'window');
const DOOR = (spec.features || []).find(f => f.type === 'door');
const dirTo = p => p.clone().sub(EYE).normalize();
// where a level line from the eye at angle a (0 = north, clockwise) meets the walls, 'inset' metres inside them
function wallHit(a, inset = 0.2) {
  const dx = Math.sin(a), dz = -Math.cos(a);
  const xLo = F.X0 + inset, xHi = F.X1 - inset, zLo = -F.Y1 + inset, zHi = -F.Y0 - inset;
  const tx = dx > 1e-6 ? (xHi - EYE.x) / dx : dx < -1e-6 ? (xLo - EYE.x) / dx : 1e9;
  const tz = dz > 1e-6 ? (zHi - EYE.z) / dz : dz < -1e-6 ? (zLo - EYE.z) / dz : 1e9;
  const t = Math.max(0.3, Math.min(tx, tz)); return new THREE.Vector3(EYE.x + dx * t, EYE.y, EYE.z + dz * t);
}
const yawTo = p => Math.atan2(p.x - EYE.x, -(p.z - EYE.z));
let aim = null, aimAt_t = -99;                                 // camera mode: where to look next
const aimAt = p => { aim = dirTo(p); aimAt_t = performance.now() / 1000; };
if (WINDOW) { const c = F.w2(WINDOW.wall, +WINDOW.pos, 2, +(WINDOW.sill ?? 0.8) + +(WINDOW.height ?? 1.2) / 2); U.flashDir.value.copy(dirTo(b2t(...c))); flashLight.position.copy(b2t(...c)); }

// ---- canvas textures (own drawings)
function ctex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
const evilPumpkin = ctex(512, 512, (x, W, H) => {
  const g = x.createRadialGradient(W / 2, H * 0.55, 30, W / 2, H * 0.55, W * 0.48);
  g.addColorStop(0, '#ff9a2a'); g.addColorStop(0.7, '#d4560a'); g.addColorStop(1, 'rgba(120,30,0,0)');
  x.fillStyle = g; x.beginPath(); x.ellipse(W / 2, H * 0.55, W * 0.47, H * 0.4, 0, 0, Math.PI * 2); x.fill();
  x.fillStyle = '#3a6a10'; x.fillRect(W * 0.47, H * 0.08, W * 0.06, H * 0.12);
  const hole = (pts) => { x.beginPath(); pts.forEach(([a, b], i) => i ? x.lineTo(a * W, b * H) : x.moveTo(a * W, b * H)); x.closePath(); x.fill(); };
  x.shadowColor = '#fff1a0'; x.shadowBlur = 40; x.fillStyle = '#fff6b0';
  hole([[0.22, 0.42], [0.42, 0.47], [0.3, 0.32]]); hole([[0.78, 0.42], [0.58, 0.47], [0.7, 0.32]]);
  hole([[0.46, 0.56], [0.54, 0.56], [0.5, 0.5]]);
  hole([[0.2, 0.62], [0.3, 0.7], [0.36, 0.64], [0.43, 0.73], [0.5, 0.66], [0.57, 0.73], [0.64, 0.64], [0.7, 0.7], [0.8, 0.62], [0.72, 0.84], [0.5, 0.88], [0.28, 0.84]]);
});
const ghostTex = ctex(512, 640, (x, W, H) => {
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, 'rgba(240,245,255,0.95)'); g.addColorStop(1, 'rgba(200,215,240,0.0)');
  x.fillStyle = g; x.beginPath(); x.moveTo(W * 0.15, H * 0.95);
  x.bezierCurveTo(W * 0.1, H * 0.4, W * 0.2, H * 0.05, W * 0.5, H * 0.05); x.bezierCurveTo(W * 0.8, H * 0.05, W * 0.9, H * 0.4, W * 0.85, H * 0.95);
  for (let k = 0; k < 5; k++) { const a = W * (0.85 - k * 0.14); x.quadraticCurveTo(a - W * 0.035, H * 0.82, a - W * 0.07, H * 0.95); x.quadraticCurveTo(a - W * 0.1, H * 1.0, a - W * 0.14, H * 0.95); }
  x.closePath(); x.fill();
  x.fillStyle = 'rgba(10,10,20,0.9)';
  x.beginPath(); x.ellipse(W * 0.38, H * 0.3, W * 0.06, H * 0.07, 0, 0, 7); x.fill(); x.beginPath(); x.ellipse(W * 0.62, H * 0.3, W * 0.06, H * 0.07, 0, 0, 7); x.fill();
  x.beginPath(); x.ellipse(W * 0.5, H * 0.45, W * 0.07, H * 0.09, 0, 0, 7); x.fill();
});
const batTex = ctex(256, 128, (x, W, H) => {
  x.fillStyle = '#0b090d'; x.beginPath(); x.moveTo(W / 2, H * 0.45);
  for (const s of [1, -1]) { x.moveTo(W / 2, H * 0.4); x.quadraticCurveTo(W / 2 + s * W * 0.2, H * 0.05, W / 2 + s * W * 0.48, H * 0.25); x.quadraticCurveTo(W / 2 + s * W * 0.38, H * 0.55, W / 2 + s * W * 0.3, H * 0.5); x.quadraticCurveTo(W / 2 + s * W * 0.2, H * 0.7, W / 2, H * 0.6); }
  x.fill(); x.beginPath(); x.ellipse(W / 2, H * 0.5, W * 0.05, H * 0.2, 0, 0, 7); x.fill();
});
const figureTex = ctex(256, 512, (x, W, H) => {
  x.filter = 'blur(3px)'; x.fillStyle = '#020203';
  x.beginPath(); x.ellipse(W / 2, H * 0.12, W * 0.13, H * 0.075, 0, 0, 7); x.fill();                          // head
  x.beginPath(); x.moveTo(W * 0.42, H * 0.18); x.lineTo(W * 0.58, H * 0.18); x.lineTo(W * 0.86, H * 0.3); x.lineTo(W * 0.92, H * 0.62); x.lineTo(W * 0.8, H * 0.64);
  x.lineTo(W * 0.7, H * 0.4); x.lineTo(W * 0.68, H * 1.0); x.lineTo(W * 0.32, H * 1.0); x.lineTo(W * 0.3, H * 0.4); x.lineTo(W * 0.2, H * 0.64); x.lineTo(W * 0.08, H * 0.62); x.lineTo(W * 0.14, H * 0.3); x.closePath(); x.fill();
});
const eyesTex = ctex(128, 32, (x, W, H) => { x.shadowColor = '#ff2010'; x.shadowBlur = 10; x.fillStyle = '#ff5030'; x.beginPath(); x.ellipse(W * 0.35, H / 2, 6, 4, 0, 0, 7); x.ellipse(W * 0.65, H / 2, 6, 4, 0, 0, 7); x.fill(); });
const holeTex = ctex(1024, 1024, (x, W, H) => {
  // a broken hole in the tiles: jagged edge, shards, darkness with a faint sickly glow far down
  const pts = []; for (let k = 0; k < 28; k++) { const a = k / 28 * Math.PI * 2, r = W * (0.3 + 0.08 * Math.sin(k * 2.7) + Math.random() * 0.06); pts.push([W / 2 + Math.cos(a) * r, H / 2 + Math.sin(a) * r * 0.9]); }
  x.save(); x.beginPath(); pts.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.closePath(); x.clip();
  const g = x.createRadialGradient(W / 2, H / 2, 10, W / 2, H / 2, W * 0.42);
  g.addColorStop(0, '#000000'); g.addColorStop(0.55, '#020403'); g.addColorStop(0.85, '#0c1a0a'); g.addColorStop(1, '#1d2a14');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  for (let k = 0; k < 40; k++) { x.strokeStyle = `rgba(60,90,40,${Math.random() * 0.12})`; x.lineWidth = 2; x.beginPath(); x.arc(W / 2, H / 2, W * (0.08 + Math.random() * 0.3), Math.random() * 6, Math.random() * 6 + 1); x.stroke(); }
  x.restore();
  x.strokeStyle = '#151515'; x.lineWidth = 10; x.beginPath(); pts.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.closePath(); x.stroke();
  for (let k = 0; k < 22; k++) {                                // tile shards round the edge
    const [a, b] = pts[k % pts.length], s = 18 + Math.random() * 30, c = Math.random() < 0.5 ? '#e6e2d6' : '#1d1d1f';
    x.fillStyle = c; x.beginPath(); x.moveTo(a + Math.random() * s, b); x.lineTo(a + s, b + Math.random() * s); x.lineTo(a, b + s); x.closePath(); x.fill();
  }
  for (let k = 0; k < 8; k++) { const [a, b] = pts[Math.floor(Math.random() * pts.length)]; x.strokeStyle = 'rgba(15,15,15,0.8)'; x.lineWidth = 3; x.beginPath(); x.moveTo(a, b);
    let cx = a, cy = b; for (let j = 0; j < 6; j++) { cx += (cx - W / 2) * 0.12 + (Math.random() - 0.5) * 30; cy += (cy - H / 2) * 0.12 + (Math.random() - 0.5) * 30; x.lineTo(cx, cy); } x.stroke(); }   // cracks running out
});
const monsterEyes = ctex(256, 64, (x, W, H) => { x.shadowColor = '#d8ff40'; x.shadowBlur = 16; x.fillStyle = '#f0ff90';
  for (const cx of [W * 0.33, W * 0.67]) { x.beginPath(); x.ellipse(cx, H / 2, 20, 9, 0, 0, 7); x.fill(); }
  x.shadowBlur = 0; x.fillStyle = '#000'; for (const cx of [W * 0.33, W * 0.67]) { x.beginPath(); x.ellipse(cx, H / 2, 3, 8, 0, 0, 7); x.fill(); } });
const clawTex = ctex(256, 384, (x, W, H) => {
  x.fillStyle = '#1b2116'; x.beginPath(); x.ellipse(W / 2, H * 0.78, W * 0.26, H * 0.18, 0, 0, 7); x.fill();      // the back of the hand
  for (const [dx, ln] of [[-0.2, 0.55], [-0.06, 0.66], [0.08, 0.62], [0.22, 0.48]]) {
    x.strokeStyle = '#1b2116'; x.lineWidth = 26; x.lineCap = 'round'; x.beginPath(); x.moveTo(W / 2 + dx * W, H * 0.7);
    x.quadraticCurveTo(W / 2 + dx * W * 1.4, H * (0.7 - ln * 0.6), W / 2 + dx * W * 1.2, H * (0.7 - ln)); x.stroke();
    x.fillStyle = '#d8d2bc'; x.beginPath(); const tx = W / 2 + dx * W * 1.2, ty = H * (0.7 - ln); x.moveTo(tx - 9, ty + 6); x.lineTo(tx + 9, ty + 6); x.lineTo(tx + dx * 40, ty - 34); x.closePath(); x.fill();
  }
});
const billboard = (tex, w, h, opts = {}) => {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, side: THREE.DoubleSide, opacity: 0, ...opts }));
  m.visible = false; scene.add(m); return m;
};
const faceEye = (m, upright = true) => { if (upright) { const t = EYE.clone(); t.y = m.position.y; m.lookAt(t); } else m.lookAt(EYE); };

// ---- spiders (procedural 3D)
const spiderMat = new THREE.MeshStandardMaterial({ color: 0x14100e, roughness: 0.35, metalness: 0.1 });

      const s = Math.sign(Math.cos(ph)); if (s !== side && amp > 0.04) { side = s; sfx('creak', p, 0.45); }

    } });
  },
  knock() { if (doorLeaf) sfx('knock', doorLeaf.position.clone().setY(1.3)); },
  footsteps(from, to, n = 8, gap = 0.55) {
    from = from || b2t(R(-2, 2), -F.D / 2 - 1.5, 2.6); to = to || b2t(R(-2, 2), F.D / 2 + 1, 2.6);
    for (let k = 0; k < n; k++) setTimeout(() => sfx('step', from.clone().lerp(to, k / (n - 1)), 0.5 + 0.3 * (k / n)), k * gap * 1000);
  },
  whisper(side) { const a = side === 'left' ? -Math.PI / 2 : side === 'right' ? Math.PI / 2 : R(-3, 3);
    sfx('whisper', EYE.clone().add(new THREE.Vector3(Math.sin(a) * 1.2, 0.3, -Math.cos(a) * 1.2)), R(2.5, 4)); },
  heartbeat(dur = 8) { sfx('heartbeat', dur); },
  pumpkin(i = Math.floor(Math.random() * PUMPKINS.length)) {   // the pumpkin flares, then its face lunges at you
    const p = PUMPKINS[i % Math.max(1, PUMPKINS.length)] || b2t(0, F.D / 2, 0.8);
    U.glowDir.value.copy(dirTo(p)); aimAt(p);
    run({ update(t) {
      if (t < 1.4) { U.glow.value = ease(t / 1.4) * (0.8 + 0.2 * Math.sin(t * 9)); return true; }

      if (!this.go) { this.go = true; sfx('scream', p); shake(0.7, 0.9); pumpkinFace.visible = true; }
      const end = wallHit(yawTo(p), 0.15).setY(1.4);          // the face leaps up onto the wall above it and grows huge

  },
  spider() {                                                 // a big spider drops on its thread in front of you, twitches, climbs away
    const a = (+view.yaw || 0) * Math.PI / 180 + R(-1.2, 1.2), w = wallHit(a, 0.35);   // drops in front of a wall, stops well above the floor
    const x = w.x, z = w.z, top = F.RH - 0.02, low = 1.05;
    bigSpider.visible = thread.visible = true; bigSpider.rotation.set(Math.PI, 0, 0);
    sfx('hiss', new THREE.Vector3(x, low, z), 1.0); aimAt(new THREE.Vector3(x, low + 0.35, z));

  },
  swarm() {                                                  // spiders scuttle across the floor

    swarm.forEach((sp, i) => {
      const off = R(-1.6, 1.6), start = new THREE.Vector3(Math.cos(a) * 3.6 + Math.sin(a) * off, 0.02, Math.sin(a) * 3.6 - Math.cos(a) * off).add(new THREE.Vector3(EYE.x, 0, EYE.z));

  },
  ghost() {                                                  // glides along in front of a wall, so it lands on the projected wall at life size
    const a0 = (+view.yaw || 0) * Math.PI / 180 + R(-1.2, 1.2), side = Math.random() < 0.5 ? -1 : 1;
    const c0 = wallHit(a0, 0.3).setY(1.2); ghost.scale.setScalar(1.75);
    ghost.visible = true; sfx('moan', c0, 5); aimAt(c0);
    run({ update(t) { const k = t / 7; if (k > 1) { ghost.visible = false; return false; }
      const p = wallHit(a0 + side * (k - 0.5) * 1.3, 0.3).setY(1.2 + Math.sin(t * 2.2) * 0.08);
      ghost.position.copy(p); aim = dirTo(p);
      ghost.material.opacity = 0.85 * Math.min(1, k * 5, (1 - k) * 5); faceEye(ghost); return true; } });
  },
  floorMonster(dur = 6) {                                   // lights out; a hole opens by your feet; eyes, claws, a growl; lights back, gone
    const a = (+view.yaw || 0) * Math.PI / 180 + R(-0.6, 0.6), dist = R(0.85, 1.1);
    const c = new THREE.Vector3(EYE.x + Math.sin(a) * dist, 0.004, EYE.z - Math.cos(a) * dist);
    hole.position.copy(c); aimAt(c.clone().setY(0.25)); hole.rotation.z = R(0, 6); holeEyes.position.copy(c).add(new THREE.Vector3(0, 0.003, 0));
    holeEyes.rotation.z = -a;                                // eyes look towards you
    const toward = new THREE.Vector3(EYE.x - c.x, 0, EYE.z - c.z).normalize(), side = new THREE.Vector3(-toward.z, 0, toward.x);

      hole.material.opacity = dark;
      const eyes = t > 1.2 ? (Math.floor(t * 1.7) % 5 === 0 ? 0.1 : 1) : 0;          // a slow blink now and then
      holeEyes.material.opacity = dark * eyes * (0.7 + 0.3 * Math.sin(t * 5));
      claws.forEach((cl, i) => {                             // two hands grip the edge and drag forward
        const k = ease((t - 1.8 - i * 0.5) / 1.6), sgn = i ? 1 : -1;

  },
  bats(dur = 9) {                                            // the room floods with bats, wheeling and swooping from the ceiling down to near the floor
    const cx = (F.X0 + F.X1) / 2, cz = -(F.Y0 + F.Y1) / 2, rx = (F.X1 - F.X0) / 2 - 0.35, rz = (F.Y1 - F.Y0) / 2 - 0.35, spin = Math.random() < 0.5 ? -1 : 1;

        const ang = ph + sp * tt, wob = Math.sin(tt * 1.7 + i) * 0.25;

  haunt(dur = 10) {                                          // the room shakes and its light drains through sickly green, blood red, violet and cold blue

let shakeUntil = 0, shakeAmp = 0;
function shake(strength = 0.5, dur = 1) { shakeAmp = Math.min(1, strength); shakeUntil = performance.now() / 1000 + Math.min(2, dur); }

let figureUntil = 0;
function showFigure(dist) {
  const c = F.w2(WINDOW.wall, +WINDOW.pos + R(-0.2, 0.2), 0.15 + dist, 0);
  figure.position.copy(b2t(c[0], c[1], 0.9)); figure.visible = figEyes.visible = true; faceEye(figure);
  figEyes.position.copy(b2t(c[0], c[1], 1.6)); faceEye(figEyes);
  figure.position.addScaledVector(dirTo(figure.position).negate(), 0); figureUntil = performance.now() / 1000 + 7;
}

// ------------------------------------------------------------------ the cycle (about 8 minutes, then it loops)
const TIMELINE = [
  [12, 'creak'], [25, 'flicker', 3], [40, 'footsteps'], [55, 'lightning'], [70, 'groan', 0.4], [88, 'whisper', 'left'], [100, 'bats'],
  [118, 'creak'], [128, 'knock'], [140, 'slam'], [150, 'haunt', 10], [168, 'flicker', 4], [178, 'lightning', { figure: 'far' }], [195, 'heartbeat', 9],
  [204, 'pumpkin', 0], [230, 'creak'], [240, 'spider'], [262, 'whisper', 'right'], [275, 'floorMonster', 6], [276, 'whisper'],
  [278, 'footsteps', null, null, 6, 0.5], [300, 'ghost'], [322, 'groan', 0.9, 2], [340, 'lightning', { figure: 'near', near: 1 }],
  [356, 'creakOpen', 7], [372, 'footsteps'], [388, 'heartbeat', 8], [396, 'swarm'], [408, 'haunt', 12], [428, 'bats'],
  [445, 'lightning', { near: 1 }], [455, 'heartbeat', 6], [458, 'floorMonster', 5], [466, 'pumpkin', 1],
];
const DEMO_TIMELINE = [
  [3, 'creak'], [7, 'flicker', 3], [12, 'groan', 0.6], [17, 'lightning', { figure: 'near', near: 1 }], [23, 'slam'], [28, 'bats'],
  [30, 'rock', 6], [37, 'pumpkin', 0], [41, 'spider'], [49, 'whisper', 'left'], [52, 'floorMonster', 6], [62, 'ghost'], [70, 'creakOpen', 5],
  [74, 'swarm'], [82, 'haunt', 10], [96, 'pumpkin', 1],

const SCHEDULE = (DEMO ? DEMO_TIMELINE : TIMELINE).filter(e => e[0] < CYCLE).sort((a, b) => a[0] - b[0]);
let cycleStart = 0, nextIdx = 0;
function trigger(name, ...args) {
  if (name === 'creak' || name === 'whisper' || name === 'heartbeat') { if (name === 'creak') sfx('creak'); else FX[name](...args); return; }
  FX[name]?.(...args);
}

// ------------------------------------------------------------------ main loop
let started = false;
function frame() {
  requestAnimationFrame(frame);
  const T = performance.now() / 1000;
  if (started && auto) {
    let ct = T - cycleStart;
    if (ct >= CYCLE) { cycleStart = T; ct = 0; nextIdx = 0; if (doorOpen < 1) setDoor(1); }
    while (nextIdx < SCHEDULE.length && SCHEDULE[nextIdx][0] <= ct) { const [, n, ...a] = SCHEDULE[nextIdx++]; trigger(n, ...a); }
    if (hudOn) { const nx = SCHEDULE[nextIdx]; hud.hidden = false; hud.textContent = `Halloween cycle ${fmt(ct)} / ${fmt(CYCLE)}${nx ? `   next: ${nx[1]} in ${Math.ceil(nx[0] - ct)} s` : ''}${muted ? '   (muted)' : ''}${AC && AC.state !== 'running' ? '   (sound blocked by the browser: click or press a key)' : ''}`; }
  } else if (hudOn && started) { hud.hidden = false; hud.textContent = `Auto off: keys 1–9, 0, F, J, C, R${muted ? '   (muted)' : ''}`; }
  if (started && chair && T > nextRock) { nextRock = T + R(25, 50); if (![...active].some(f => f.isRock)) FX.rock(R(5, 9)); }   // every so often, by itself
  for (const fx of [...active]) { if (fx.update(T - fx.t0) === false) active.delete(fx); }
  // the bulb: ease towards its target level, plus a faint hum wobble
  U.lightMix.value += (lightTarget - U.lightMix.value) * 0.35;
  U.bright.value = 1;
  amb.intensity = 0.06 + 0.35 * U.lightMix.value + U.flash.value * 0.8; bulb.intensity = 3 * U.lightMix.value;
  // shake: small, fast, short
  if (T < shakeUntil) { const k = (shakeUntil - T) / 2, a = shakeAmp * Math.min(1, k * 3) * 0.012;
    U.shake.value.set((Math.sin(T * 47) + Math.sin(T * 29.3)) * a, (Math.sin(T * 39.7) + Math.cos(T * 23.1)) * a * 0.6); } else U.shake.value.set(0, 0);

    else { figure.material.opacity = Math.min(1, U.flash.value * 1.5); figEyes.material.opacity = (0.35 + 0.65 * (Math.sin(T * 1.3) * 0.5 + 0.5)) * Math.min(1, left) * (1 - U.flash.value); } }
  if (LOOK) {                                               // turn smoothly to the latest scare, otherwise drift slowly round the room
    let ty, tp;
    if (aim && T - aimAt_t < 6) { ty = Math.atan2(aim.x, -aim.z); tp = Math.asin(Math.max(-1, Math.min(1, aim.y))); }
    else { ty = U.viewYaw.value + Math.sin(T * 0.07) * 1.6; tp = -0.08 + Math.sin(T * 0.11) * 0.08; }

}
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;

function start() {
  if (started) { initAudio(); AC?.resume(); return; }
  started = true; document.getElementById('start').style.display = 'none'; cycleStart = performance.now() / 1000;
  initAudio(); AC.resume();
}
document.getElementById('start').addEventListener('click', start);
addEventListener('keydown', e => {
  if (!started) { start(); return; }
  AC?.resume();
  const k = e.key.toLowerCase();
  const map = { '1': () => FX.pumpkin(), '2': () => FX.spider(), '3': () => FX.ghost(), '4': () => (doorOpen > 0.5 ? FX.slam() : FX.creakOpen(4)),
    '5': () => FX.lightning({ figure: 'near', near: 1 }), '6': () => FX.groan(0.8, 2), '7': () => FX.blackout(4), '8': () => FX.swarm(), '9': () => FX.bats(),
    '0': () => FX.whisper(), 'f': () => FX.flicker(4), 'j': () => FX.floorMonster(6), 'c': () => FX.haunt(10), 'r': () => FX.rock(7), 'k': () => FX.knock(), 'a': () => { auto = !auto; cycleStart = performance.now() / 1000; nextIdx = 0; },
    'm': () => { muted = !muted; if (master) master.gain.value = muted ? 0 : 0.9; }, 'h': () => { hudOn = !hudOn; hud.hidden = !hudOn; } };

// starts by itself (in the room nobody can click it); &autostart=0 brings back the click-to-start screen
if (P.get('autostart') !== '0') start();

setInterval(() => { if (AC && AC.state !== 'running') AC.resume().catch(() => {}); }, 1500);
for (const ev of ['pointerdown', 'touchstart', 'mousedown']) addEventListener(ev, () => { if (!started) start(); else { initAudio(); AC?.resume(); } }, { passive: true });
window.__halloween = { chair, FX, setDoor, U, scene, cubeCam, cubeRT, room, EYE, THREE };                    // for testing
requestAnimationFrame(frame);
</script>
