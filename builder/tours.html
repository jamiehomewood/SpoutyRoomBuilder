<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tour Builder</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/jsm/" } }
</script>
<style>
  body { overflow: hidden; }
  #top a.brand { text-decoration: none; }
  #top .crumb { color: var(--muted); }
  #dirty { color: var(--accent2); font-size: 13px; white-space: nowrap; }
  #tl { display: grid; grid-template-columns: clamp(250px, 22vw, 320px) 1fr clamp(270px, 24vw, 340px); height: calc(100% - 48px); }
  @media (max-width: 1100px) {             /* narrow windows: picture on top, the two panels underneath, page scrolls */
    body { overflow: auto; }
    #top { height: auto; min-height: 48px; flex-wrap: wrap; padding: 6px 12px; }
    #tl { grid-template-columns: 1fr 1fr; height: auto; }
    #mid { grid-column: 1 / -1; grid-row: 1; }
    #scroller { flex: none; overflow-y: hidden; }
    #left, #right { grid-row: 2; overflow: visible; }
  }
  @media (max-width: 640px) { #tl { grid-template-columns: 1fr; } #right { grid-row: 3; } }
  #left, #right { background: var(--panel); overflow-y: auto; padding: 10px 12px 40px; }
  #left { border-right: 1px solid var(--line); } #right { border-left: 1px solid var(--line); }
  #mid { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #tools .lab { color: var(--muted); font-size: 13px; }
  #tools .tool i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; border: 2px solid currentColor; vertical-align: -1px; }
  #scroller { flex: 1; overflow: auto; position: relative; background: #0d0f11; min-height: 180px; }
  #pano { display: block; touch-action: none; }
  #pano3d { position: absolute; left: 0; top: 0; pointer-events: none; }
  .itemrow { display: grid; grid-template-columns: 40px 1fr auto auto; gap: 6px; align-items: center; margin-bottom: 6px; }
  .itemrow img, .itemrow .noimg { width: 40px; height: 40px; border-radius: 6px; background: #111 center/contain no-repeat; object-fit: contain; border: 1px solid var(--line); }
  .cat { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; max-height: 52vh; overflow-y: auto; padding: 2px; }
  .cat button { display: flex; flex-direction: column; gap: 4px; padding: 6px; text-align: left; }
  .cat button.on { border-color: var(--accent); background: #2f2a20; }
  .cat img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #2a2f35; border-radius: 4px; }
  .cat small { color: var(--muted); font-size: 11px; }
  .upl { border: 1px dashed var(--line); border-radius: 8px; padding: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .warnbox { background: #3a2f1d; border-left: 3px solid var(--warn); padding: 6px 8px; border-radius: 6px; font-size: 12px; margin: 6px 0; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); text-align: center; padding: 20px; pointer-events: none; }
  #status { padding: 6px 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; background: var(--panel); min-height: 28px; }
  h3 { margin: 16px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  h3:first-child { margin-top: 4px; }
  h3 button { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 12px; padding: 2px 8px; }
  .f { display: flex; flex-direction: column; gap: 4px; margin-bottom: 9px; }
  .f > span { color: var(--muted); font-size: 12px; }
  .f input[type=text], .f select, .f textarea { width: 100%; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row > * { min-width: 0; }
  .chk { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; cursor: pointer; }
  .small { color: var(--muted); font-size: 12px; line-height: 1.4; }
  .rooms { display: flex; flex-direction: column; gap: 6px; }
  .room { display: grid; grid-template-columns: 76px 1fr; gap: 8px; align-items: center; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); cursor: pointer; }
  .room.on { border-color: var(--accent); background: #2f2a20; }
  .room img { width: 76px; height: 38px; object-fit: cover; border-radius: 4px; background: #111; display: block; }
  .room b { display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .room small { color: var(--muted); font-size: 11px; }
  .badge { display: inline-block; font-size: 10px; padding: 0 5px; border-radius: 3px; background: #3a4250; color: #dfe4ea; margin-left: 4px; }
  .badge.start { background: #2f6b47; } .badge.end { background: #6b2f2f; }
  .item { display: flex; gap: 6px; margin-bottom: 6px; } .item input { flex: 1; }
  .checks div { padding: 5px 8px; border-radius: 6px; margin-bottom: 4px; font-size: 12px; cursor: pointer; background: #2a2622; border-left: 3px solid var(--warn); }
  .checks div.info { border-left-color: var(--blue); background: #20262c; }
  .checks div.ok { border-left-color: var(--ok); background: #1f2a23; cursor: default; }
  .opt { border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 8px; background: var(--panel2); }
  .opt .row { margin-bottom: 6px; }
  .mlist div { padding: 5px 8px; border-radius: 6px; margin-bottom: 4px; cursor: pointer; background: var(--panel2); font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .mlist div i, .typedot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid; flex: none; display: inline-block; }
  .mlist div.on { outline: 1px solid var(--accent); }
  .pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; max-height: 60vh; overflow-y: auto; padding: 2px; }
  .pick button { text-align: left; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
  .pick img { width: 100%; aspect-ratio: 2/1; object-fit: cover; border-radius: 4px; background: #111; }
  .pick small { color: var(--muted); font-size: 11px; }
  dialog { width: min(900px, 94vw); }
  .dlg { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .dlg h2 { margin: 0; font-size: 17px; }
  .dlg .foot { display: flex; justify-content: flex-end; gap: 8px; }
  .tours { display: flex; flex-direction: column; gap: 6px; max-height: 60vh; overflow-y: auto; }
  .tours .t { display: grid; grid-template-columns: 96px 1fr auto auto; gap: 10px; align-items: center; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); }
  .tours img { width: 96px; height: 48px; object-fit: cover; border-radius: 4px; background: #111; }
  #toast { position: fixed; top: 58px; right: 16px; z-index: 5; }
</style>
</head>
<body>
<header id="top">
  <a class="brand" href="/builder/" title="Back to Room Builder">Room Builder</a><span class="crumb">›</span><div class="brand">Tour Builder</div>
  <input id="tourName" class="name" spellcheck="false" title="Tour name" placeholder="Tour name">
  <div class="btns">
    <button id="bNew" title="Start a new tour">New</button>
    <button id="bOpen" title="Open a saved tour">Open</button>
    <button id="bSave" class="primary" title="Save (Ctrl+S)">Save</button>
    <span class="sep"></span>
    <button id="bPlay" title="Save, then play the tour in a drag-to-look viewer">Play (look round)</button>
    <button id="bPlayRoom" title="Save, then play the tour as the room shows it (the full 360 image) - use this URL in Spouty">Play (room view)</button>
  </div>
  <span id="dirty"></span>
</header>
<div id="tl">
  <aside id="left"></aside>
  <main id="mid">
    <div id="tools">
      <span class="lab">Click the picture to add:</span>
      <span class="seg" id="toolSeg">
        <button data-tool="select" class="on" title="Pick and drag markers (Esc)">Select</button>
        <button data-tool="go" class="tool" title="A door or way through to another room"><i style="color:#4fd18b"></i>Door / go</button>
        <button data-tool="info" class="tool" title="A card of information"><i style="color:#5aa2e0"></i>Info</button>
        <button data-tool="question" class="tool" title="A question: answers can lead to different rooms"><i style="color:#e8a33d"></i>Question</button>
        <button data-tool="item" class="tool" title="Something to find and pick up (a key, notes, a medicine): can be a 3D model"><i style="color:#f3d36b"></i>Item</button>
        <button data-tool="use" class="tool" title="A person or place that takes items: give the notes to the doctor, the medicine to the patient"><i style="color:#c58cf0"></i>Give / use</button>
      </span>
      <span class="sep"></span>
      <span class="lab">Zoom</span>
      <span class="seg" id="zoomSeg"><button data-z="1" class="on">Fit</button><button data-z="2">2×</button><button data-z="3">3×</button></span>
      <label class="chk" style="margin:0" title="Shade what lands on the projected floor and the unprojected ceiling in the physical room"><input type="checkbox" id="chkZones" checked> Floor &amp; ceiling</label>
    </div>
    <div id="scroller"><canvas id="pano"></canvas><div id="empty">Add a room from the library to start (left panel).</div></div>
    <div id="status"></div>
  </main>
  <aside id="right"></aside>
</div>
<dialog id="dlg"><form method="dialog" id="dlgBody" class="dlg"></form></dialog>
<div id="toast" hidden></div>
<script src="tours.js"></script>
</body>
</html>
